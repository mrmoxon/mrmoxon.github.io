<!DOCTYPE html>
<html lang="{{ page.lang | default: site.lang | default: "en" }}">

  {%- include head.html -%}

  <body class="{% if page.url == '/' %}personal-home{% else %}personal-page{% endif %}">
    <header class="simple-header">
      <h1 class="personal-name"><a href="{{ '/' | relative_url }}">Oscar Moxon</a></h1>
      {% if page.url == '/' %}
      <a class="header-page-link header-writing-link" href="{{ '/writing/' | relative_url }}" aria-label="Writing" title="Writing">
        <!-- Lucide pen, ISC license. -->
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.25" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M17 3a2.828 2.828 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5Z"/><path d="m15 5 4 4"/></svg>
      </a>
      {% elsif page.layout != 'post' %}
      <a class="header-page-link header-about-link" href="{{ '/' | relative_url }}" aria-label="About" title="About">
        <!-- Lucide fingerprint, ISC license. -->
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.25" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 10a2 2 0 0 0-2 2c0 1.02-.1 2.51-.26 4"/><path d="M14 13.12c0 2.38 0 6.38-1 8.88"/><path d="M17.29 21.02c.12-.6.43-2.3.5-3.02"/><path d="M2 12a10 10 0 0 1 18-6"/><path d="M2 16h.01"/><path d="M21.8 16c.2-2 .131-5.354 0-6"/><path d="M5 19.5C5.5 18 6 15 6 12a6 6 0 0 1 .34-2"/><path d="M8.65 22c.21-.66.45-1.32.57-2"/><path d="M9 6.8a6 6 0 0 1 9 5.2v2"/></svg>
      </a>
      {% endif %}
    </header>

    <main class="page-content" aria-label="Content">
      <div class="wrapper">
        {{ content }} 
      </div>
    </main>

    {%- include footer.html -%}

  </body>

</html>
