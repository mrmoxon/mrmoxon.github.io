  document.addEventListener('DOMContentLoaded', function() {
    // Target all external links and custom-link elements
    let links = document.querySelectorAll('.post-content a[href^="http"], .custom-link');
    let counter = 1;

    links.forEach((link) => {
      // Skip if already processed or is an image link
      if (link.querySelector('.link-preview') || link.querySelector('img')) return;

      // Add custom-link class for styling
      link.classList.add('custom-link');

      // Create the number element
      let numberSpan = document.createElement('span');
      numberSpan.className = 'custom-link-number';
      numberSpan.textContent = counter++;
      link.appendChild(numberSpan);

      // Create preview element
      let preview = document.createElement('div');
      preview.className = 'link-preview';
      preview.textContent = getSiteName(link.href);
      link.appendChild(preview);
    });
  });

  function getSiteName(url) {
    try {
      const hostname = new URL(url).hostname;
      return hostname.replace(/^www\./, '');
    } catch (e) {
      return url;
    }
  }
</script>
