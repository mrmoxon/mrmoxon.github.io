<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>3D Axes: Intellect, Agency, Presence</title>
  <style>
    body { margin: 0; background-color: #f0e4d1; } /* Sandy muted tone */
    canvas { display: block; }
  </style>
</head>
<body>
  <script src="https://cdn.jsdelivr.net/npm/three@0.157.0/build/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.157.0/examples/js/controls/OrbitControls.js"></script>
  <script>
    const scene = new THREE.Scene();
    scene.background = new THREE.Color("#f0e4d1");

    const camera = new THREE.PerspectiveCamera(45, window.innerWidth/window.innerHeight, 0.1, 1000);
    camera.position.set(5, 5, 5);

    const renderer = new THREE.WebGLRenderer({antialias: true});
    renderer.setSize(window.innerWidth, window.innerHeight);
    document.body.appendChild(renderer.domElement);

    const controls = new THREE.OrbitControls(camera, renderer.domElement);

    // Axes
    const axisLength = 3;
    const arrowHeadSize = 0.1;
    const arrowColor = (hex) => new THREE.Color(hex);

    const addAxis = (dir, color, label) => {
      const arrow = new THREE.ArrowHelper(dir.clone().normalize(), new THREE.Vector3(0, 0, 0), axisLength, color);
      scene.add(arrow);

      const loader = new THREE.FontLoader();
      loader.load("https://threejs.org/examples/fonts/helvetiker_regular.typeface.json", font => {
        const textGeometry = new THREE.TextGeometry(label, {
          font: font,
          size: 0.2,
          height: 0.02,
        });
        const textMaterial = new THREE.MeshBasicMaterial({ color: color });
        const text = new THREE.Mesh(textGeometry, textMaterial);
        text.position.copy(dir.clone().normalize().multiplyScalar(axisLength + 0.1));
        scene.add(text);
      });
    };

    addAxis(new THREE.Vector3(1, 0, 0), 0x8b5e3c, "Agency");
    addAxis(new THREE.Vector3(0, 1, 0), 0x8b5e3c, "Intellect");
    addAxis(new THREE.Vector3(0, 0, 1), 0x8b5e3c, "Presence");

    // Light
    const ambientLight = new THREE.AmbientLight(0xffffff, 0.8);
    scene.add(ambientLight);
    const directionalLight = new THREE.DirectionalLight(0xffffff, 0.6);
    directionalLight.position.set(5, 10, 7.5);
    scene.add(directionalLight);

    // Render loop
    const animate = function () {
      requestAnimationFrame(animate);
      renderer.render(scene, camera);
    };
    animate();

    // Responsive resizing
    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth/window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    }, false);
  </script>
</body>
</html>
