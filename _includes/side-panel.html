{% if page.layout == 'post' %}
<button class="menu-toggle" aria-label="Toggle contents menu" style="display: none;">
  <span></span>
  <span></span>
  <span></span>
</button>

<div class="side-panel">
  <div class="side-panel-content">
    <div class="side-panel-text">
      <h3>Contents</h3>
    </div>
    
    <div class="side-panel-menu" id="contents-menu">
      <!-- Contents will be populated by JavaScript -->
    </div>
  </div>
</div>

<script>
document.addEventListener('DOMContentLoaded', function() {
  const panel = document.querySelector('.side-panel');
  const toggle = document.querySelector('.menu-toggle');
  const contentsMenu = document.getElementById('contents-menu');
  
  // First ensure all headings have IDs (fallback if auto_ids fails)
  const allHeadings = document.querySelectorAll('.post-content h1, .post-content h2, .post-content h3, .post-content h4, .post-content h5, .post-content h6');
  allHeadings.forEach((heading, index) => {
    if (!heading.id) {
      // Generate ID from heading text
      const text = heading.textContent.trim();
      const id = text.toLowerCase()
        .replace(/[^\w\s-]/g, '') // Remove special characters
        .replace(/\s+/g, '-') // Replace spaces with hyphens
        .replace(/^-+|-+$/g, '') // Remove leading/trailing hyphens
        .substring(0, 50); // Limit length
      heading.id = id || `heading-${index}`;
    }
  });
  
  // Generate contents menu from headings with IDs
  const headings = document.querySelectorAll('.post-content h1[id], .post-content h2[id], .post-content h3[id], .post-content h4[id], .post-content h5[id], .post-content h6[id]');
  
  // Only show menu if headings exist
  if (headings.length === 0) {
    panel.style.display = 'none';
    toggle.style.display = 'none';
    return;
  } else {
    toggle.style.display = 'flex';
  }

  // Initialize collapsed state based on screen size
  if (window.innerWidth <= 1400) {
    panel.classList.add('collapsed');
    toggle.classList.remove('active');
  }

  // Toggle panel
  toggle.addEventListener('click', function() {
    panel.classList.toggle('collapsed');
    toggle.classList.toggle('active');
  });

  // Close panel when clicking outside on mobile
  panel.addEventListener('click', function(e) {
    if (e.target === panel && window.innerWidth <= 1400) {
      panel.classList.add('collapsed');
      toggle.classList.remove('active');
    }
  });

  const menuItems = Array.from(headings).map(heading => {
    const level = parseInt(heading.tagName[1]);
    const indent = (level - 1) * 15;
    const link = document.createElement('a');
    link.href = `#${heading.id}`;
    link.className = 'side-panel-menu-item';
    
    // Remove Roman numerals followed by a dot and trim whitespace
    let text = heading.textContent;
    text = text.replace(/^(?:I{1,3}|IV|V|VI{1,3}|IX|X)\.\s*/, '');
    link.textContent = text.trim();
    
    link.style.paddingLeft = `${indent}px`;
    
    // Add click handler to close menu on mobile after navigation
    link.addEventListener('click', function() {
      // Close menu on narrow screens after clicking a link
      if (window.innerWidth <= 1400) {
        panel.classList.add('collapsed');
        toggle.classList.remove('active');
      }
    });
    
    return link;
  });

  // Add menu items to contents menu
  menuItems.forEach(item => contentsMenu.appendChild(item));

  // Highlight current section while scrolling
  let currentSection = null;
  
  function highlightSection() {
    const scrollPosition = window.scrollY;
    
    for (let i = headings.length - 1; i >= 0; i--) {
      const heading = headings[i];
      if (heading.offsetTop <= scrollPosition + 100) {
        if (currentSection !== heading) {
          if (currentSection) {
            const currentIndex = Array.from(headings).indexOf(currentSection);
            if (currentIndex >= 0) {
              menuItems[currentIndex].classList.remove('active');
            }
          }
          menuItems[i].classList.add('active');
          currentSection = heading;
        }
        break;
      }
    }
  }

  window.addEventListener('scroll', highlightSection);
  highlightSection();
});
</script>
{% endif %}
