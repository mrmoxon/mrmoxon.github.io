<head>
  <meta charset="utf-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <link rel="icon" type="image/svg+xml" href="{{ "/favicon.svg" | relative_url }}">

  {%- seo -%}

  <!-- Google Fonts: Lora (body) and Young Serif (headings) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500&family=Crimson+Pro:wght@400;500&family=EB+Garamond:wght@400;500&family=Libre+Baskerville&family=Lora:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500&family=Source+Serif+4:wght@400;500&family=Spectral:wght@400;500&family=Young+Serif&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="{{ "/assets/css/style.css" | relative_url }}">
  {%- feed_meta -%}
  <link rel="alternate" type="application/atom+xml" title="{{ site.title | default: site.name }} Feed" href="{{ '/feed.xml' | absolute_url }}">
  {%- if jekyll.environment == 'production' and site.google_analytics -%}
    {%- include google-analytics.html -%}
  {%- endif -%}

  <!-- Add number removal script -->
  <script src="{{ "/assets/js/remove-numbers.js" | relative_url }}"></script>

  {%- include custom-head.html -%}
  
</head>
